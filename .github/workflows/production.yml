name: production
# Fabrication des vidéos en série : un envoi qui modifie tiktok/commande.json lance la fabrication des lots
# commandés (5 épisodes par lot). Chaque épisode est fabriqué de bout en bout sur sa propre machine puis
# déposé dans le brouillon de publication de son jour (visible seulement par le propriétaire du dépôt).
# Les prises de voix sont gardées en cache, chiffrées : une panne en fin de chaîne ne les fait pas perdre.
on:
  push:
    branches: [main]
    paths: ["tiktok/commande.json"]
  workflow_dispatch:
    inputs:
      lots:
        description: "Lots à fabriquer (ex. j079-j126) ; vide = tiktok/commande.json"
        required: false
permissions:
  contents: write
  actions: write
concurrency: production
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      episodes: ${{ steps.p.outputs.episodes }}
      suite: ${{ steps.p.outputs.suite }}
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: |
            /tiktok/outils/
            /tiktok/lots/
            /tiktok/commande.json
            /tiktok/personnages.json
          sparse-checkout-cone-mode: false
      - id: p
        env:
          GH_TOKEN: ${{ github.token }}
          LOTS: ${{ github.event.inputs.lots }}
        run: python3 tiktok/outils/releases.py plan >> "$GITHUB_OUTPUT"

  episode:
    needs: plan
    if: needs.plan.outputs.episodes != '[]'
    name: ${{ matrix.ep }}
    runs-on: ubuntu-latest
    timeout-minutes: 330
    strategy:
      fail-fast: false
      max-parallel: 19
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.episodes) }}
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: |
            /tiktok/outils/
            /tiktok/lots/
            /tiktok/personnages.json
            /tiktok/voix_ref/refs/
            /tiktok/fonds/couvertures/
            /${{ matrix.fond }}.enc
            /templates/
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Installation
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fluidsynth musescore-general-soundfont > /dev/null
          python -m venv /tmp/tts
          /tmp/tts/bin/pip install -q --index-url https://download.pytorch.org/whl/cpu --extra-index-url https://pypi.org/simple chatterbox-tts 2>&1 | tail -3
          /tmp/tts/bin/pip install -q faster-whisper soundfile num2words playwright mido 2>&1 | tail -3
          /tmp/tts/bin/python -m playwright install --with-deps chromium > /dev/null 2>&1
          echo "/tmp/tts/bin" >> "$GITHUB_PATH"
          ffmpeg -hide_banner -filters 2>/dev/null | grep -q rubberband && echo "rubberband disponible" || echo "rubberband absent : atempo"
      - name: Prises déjà calculées
        uses: actions/cache/restore@v4
        with:
          path: prises.tar.enc
          key: prises-${{ matrix.ep }}-${{ hashFiles(format('tiktok/lots/{0}.json', matrix.lot)) }}-${{ github.run_id }}
          restore-keys: prises-${{ matrix.ep }}-${{ hashFiles(format('tiktok/lots/{0}.json', matrix.lot)) }}-
      - name: Références de voix, fond et prises déchiffrés
        env:
          COFFRE_CLE: ${{ secrets.COFFRE_CLE }}
        run: |
          bash tiktok/outils/coffre.sh dechiffrer tiktok/voix_ref
          bash tiktok/outils/coffre.sh dechiffrer tiktok/fonds
          if [ -f prises.tar.enc ]; then
            openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in prises.tar.enc -pass env:COFFRE_CLE | tar -x
            echo "prises reprises : $(ls tiktok/${{ matrix.ep }}/voix_cb/*/*.flac 2>/dev/null | wc -l)"
          fi
      - name: Fabrication
        run: |
          set +e
          python3 tiktok/outils/fabriquer.py "${{ matrix.lot }}" "${{ matrix.ep }}" "$RUNNER_TEMP/livraison"
          code=$?
          echo "code de sortie $code"
          [ "$code" = 0 ] || [ "$code" = 4 ]
      - name: Prises chiffrées pour une reprise
        if: always()
        env:
          COFFRE_CLE: ${{ secrets.COFFRE_CLE }}
        run: |
          rm -f prises.tar.enc
          if [ -d "tiktok/${{ matrix.ep }}/voix_cb" ]; then
            tar -c "tiktok/${{ matrix.ep }}/voix_cb" | openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt -out prises.tar.enc -pass env:COFFRE_CLE
          fi
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: prises.tar.enc
          key: prises-${{ matrix.ep }}-${{ hashFiles(format('tiktok/lots/{0}.json', matrix.lot)) }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Dépôt dans le brouillon du jour
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tiktok/outils/releases.py envoyer "${{ matrix.release }}" "$RUNNER_TEMP"/livraison/*

  suite:
    # Commande suivante lancée d'elle-même : les 180 jours se fabriquent sans intervention
    needs: [plan, episode]
    if: always() && needs.plan.outputs.suite != ''
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run production.yml --repo "${{ github.repository }}" -f lots="${{ needs.plan.outputs.suite }}"
