name: import
# Vidéos fabriquées en local : déposées chiffrées dans tiktok/livraison_locale/jour-NNN/, elles sont
# déchiffrées et rangées dans le brouillon de publication du jour (créé s'il manque), puis retirées du dépôt.
on:
  push:
    branches: [main]
    paths: ["tiktok/livraison_locale/**"]
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency: import
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rangement dans les brouillons de publication
        env:
          GH_TOKEN: ${{ github.token }}
          COFFRE_CLE: ${{ secrets.COFFRE_CLE }}
        run: |
          shopt -s nullglob
          for d in tiktok/livraison_locale/jour-*/; do
            tag=$(basename "$d")
            for f in "$d"*.enc; do
              openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in "$f" -out "${f%.enc}" -pass env:COFFRE_CLE
            done
            rid=$(python3 - "$tag" <<'PY'
          import sys
          sys.path.insert(0, "tiktok/outils")
          from releases import DEPOT, appel, toutes_releases
          tag = sys.argv[1]
          rel = {r["tag_name"]: r for r in toutes_releases()}.get(tag) or appel(
              "POST", f"/repos/{DEPOT}/releases",
              {"tag_name": tag, "name": f"Jour {int(tag[5:])}", "draft": True, "body": "Vidéos fabriquées en local."})
          print(rel["id"])
          PY
            )
            fichiers=$(ls "$d" | grep -v '\.enc$' | sed "s#^#$d#")
            python3 tiktok/outils/releases.py envoyer "$rid" $fichiers
          done
          gh workflow run brouillons.yml --repo "$GITHUB_REPOSITORY" || true      # envoi du jour sans attendre
          git config user.name "tiktok-studio"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -rq tiktok/livraison_locale
          git commit -q -m "Import des vidéos locales terminé" || exit 0
          for i in 1 2 3 4 5; do git pull -q --rebase && git push -q && exit 0; sleep 7; done
