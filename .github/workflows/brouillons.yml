name: brouillons
# Chaque matin : les 5 vidéos du jour partent dans la boîte de réception TikTok de Tom (brouillons),
# et leurs légendes sur son téléphone (ntfy). Gratuit : API officielle de TikTok, droit video.upload.
# Réglages : tiktok/brouillons.json. Secrets : TIKTOK_CLIENT_KEY, TIKTOK_CLIENT_SECRET, COFFRE_CLE.
on:
  schedule:
    - cron: "23 5 * * *"
  push:
    branches: [main]
    paths: ["tiktok/tiktok_code.enc", "tiktok/brouillons.json"]
  workflow_dispatch:
permissions:
  contents: write
concurrency: brouillons
jobs:
  brouillons:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: |
            /tiktok/outils/
            /tiktok/brouillons.json
            /tiktok/tiktok_jeton.json.enc
            /tiktok/tiktok_code.enc
            /.gitignore
          sparse-checkout-cone-mode: false
      - name: Brouillons du jour
        env:
          GH_TOKEN: ${{ github.token }}
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          COFFRE_CLE: ${{ secrets.COFFRE_CLE }}
        run: |
          if [ -z "$TIKTOK_CLIENT_SECRET" ]; then echo "secrets TikTok absents : rien à faire"; exit 0; fi
          ouvrir() { openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in "$1" -out "$2" -pass env:COFFRE_CLE; }
          fermer() { openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt -in "$1" -out "$2" -pass env:COFFRE_CLE; }
          [ -f tiktok/tiktok_jeton.json.enc ] && ouvrir tiktok/tiktok_jeton.json.enc tiktok/tiktok_jeton.json
          if [ -f tiktok/tiktok_code.enc ]; then
            ouvrir tiktok/tiktok_code.enc tiktok/tiktok_code.txt
            python3 tiktok/outils/brouillons.py autoriser
            git rm -q tiktok/tiktok_code.enc; rm -f tiktok/tiktok_code.txt
          fi
          if [ -f tiktok/tiktok_jeton.json ]; then
            python3 tiktok/outils/brouillons.py auto
            fermer tiktok/tiktok_jeton.json tiktok/tiktok_jeton.json.enc; rm -f tiktok/tiktok_jeton.json
          fi
      - name: Suivi enregistré
        if: always()
        run: |
          rm -f tiktok/tiktok_jeton.json tiktok/tiktok_code.txt
          git config user.name "tiktok-studio"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A tiktok/brouillons.json tiktok/tiktok_jeton.json.enc tiktok/tiktok_code.enc 2>/dev/null
          git commit -q -m "Brouillons TikTok : suivi du $(date -u +%F)" || exit 0
          for i in 1 2 3 4 5; do git pull -q --rebase && git push -q && exit 0; sleep 7; done
